<!DOCTYPE html>
<html>
<head>
  <title>Notes App</title>
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <h2 class="logo">
       <i class="fa-solid fa-book-open"></i>
        NotesApp</h2>

    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Login</a></li>
      <li><a href="#">Signup</a></li>
      <li><a href="#">Logout</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <h1>Welcome to Notes App 🌿</h1>
    <p>Start writing your notes...</p>
    <div class="main">

  <!-- Categories -->
  <div class="categories">
    <p data-cat="work">Work</p>
    <p data-cat="personal">Personal</p>
    <p data-cat="study">Study</p>
  </div>

  <!-- Notes Section to add new notes -->
  <div class="notes-section">
         <div class="input-group">
             <input type="text" placeholder="Note Title">
          </div>

         <div class="input-group">
             <textarea placeholder="Write your notes..."></textarea>
          </div>

          <button class="save-btn">Save Note</button>

  </div>


  <!-- Notes Container  to display notes-->
  <div id="notesContainer">
    


  </div>
  



  </div>

  <script src="index.js"></script>
</body>
</html>
