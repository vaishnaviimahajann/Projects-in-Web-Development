<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>To-Do</title>

<style>
body{
    margin: 0;
    height: 100vh;

    background-image: url("https://img.freepik.com/free-vector/white-background-gradient-modern-abstract-design-wave_343694-2337.jpg?w=2000");
    background-size: cover;
    background-position: center;

    display: flex;
    flex-direction: column;
    align-items: center;

    font-family: Arial;
}

/* TOP HEADING */
.title{
    margin-top: 30px;
    font-size: 40px;
    font-weight: bold;
}

/* INPUT BAR */
.input-box{
    margin: 20px;
}

.input-box input{
    padding: 12px;
    width: 300px;
    border-radius: 10px 0 0 10px;
    border: 2px solid black;
    outline: none;
}

.input-box button{
    padding: 12px;
    border-radius: 0 10px 10px 0;
    border: 2px solid black;
    background: pink;
    cursor: pointer;
}

/* MAIN TASK BOX */
.container{
    width: 400px;
    height: 400px;
    background: rgba(255,255,255,0.9);
    border: 2px solid black;
    border-radius: 15px;
    padding: 15px;
}

/* SMALL HEADING */
.sub-heading{
    font-weight: bold;
    margin-bottom: 10px;
}

/* TASK ITEM */
li{
    list-style: none;
    margin: 10px 0;
    padding: 10px;
    background: #eee;
    border-radius: 10px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* DELETE ICON */
.delete{
    color: red;
    cursor: pointer;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="title">📝 TO-DO</div>
<h1>Act Now, Simplify Life 🌸</h1>

<div class="input-box">
    <input type="text" id="taskInput" placeholder="Add a to-do item...">
    <button onclick="addTask()">Add</button>
</div>

<div class="container">
    <div class="sub-heading"></div>
    <ul id="list"></ul>
</div>

<script>
function addTask(){
    let input = document.getElementById("taskInput").value;

    if(input === "") return;

    let li = document.createElement("li");
    li.innerHTML = input + " <span onclick='this.parentElement.remove()'>❌</span>";

    document.getElementById("list").appendChild(li);

    document.getElementById("taskInput").value = "";
}
</script>

</body>
</html>
