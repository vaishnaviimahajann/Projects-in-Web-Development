<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="feedbackform.css">
</head>
<body>
    <!--Header-->
    <header class="navbar">
        <h2>📚 MyLibrary</h2>
    </header>

    <!--Feedback form-->
    <section class="feedbackform-container">
        <h1>User Feedback Form</h1>
        <p>Help us to improve your experience with My Library</p>

        <form>
            <!--Basic Details-->
            <label>You are : </label>
                <select>
                      <option value="">Student</option>
                      <option value="">Teacher</option>
                      <option value="">General Reader</option>
                </select>

             <label>How often do you visit My library ? </label>
                <select>
                      <option value="">Daily</option>
                      <option value="">Weekly</option>
                      <option value="">Ocasionally</option>
                </select>


            <!--UI FeedBack-->
            <h3>Website & UI FeedBack</h3>
             <label>HomePage Design : </label>
                <select>
                      <option value="">Excellent</option>
                      <option value="">Good</option>
                      <option value="">Average</option>
                      <option value="">Poor</option>
                </select>


            <!--Website Navigation-->
             <label>Website Navigation : </label>
                <select>
                      <option value="">Very-Easy</option>
                      <option value="">Easy</option>
                      <option value="">Difficult</option>
                </select>

            <!--Best-Sellers-->
            <h3>Best Sellers Section</h3>
            <label>Best-Seller seaction is userful? </label>
                <select>
                      <option value="">Yes</option>
                      <option value="">Neutral</option>
                      <option value="">No</option>
                </select>

            <!--Book-Section-->
            <h3>Book-Section</h3>
            <label>Which categories Do you like??</label>
            <div class="checkbox-group">
                <label class="option"><input type="checkbox">Novels</label>
                 <label class="option"><input type="checkbox">Acedmics</label>
                  <label class="option"><input type="checkbox">Competitive</label>
                   <label class="option"><input type="checkbox">Children</label>
                     <label class="option"><input type="checkbox">Magzines</label>
                        <label class="option"><input type="checkbox">Self-Help</label>
                           <label class="option"><input type="checkbox">Art & Creativity</label>
                            <label class="option"><input type="checkbox">Reference</label>
            </div>

            <!--Overall Rating-->
            <h3>Overall Experience</h3>
            <label>OVERALL RATING </label>
                <select>
                      <option value="">⭐ ⭐ ⭐ ⭐ ⭐</option>
                      <option value="">⭐ ⭐ ⭐ ⭐</option>
                      <option value="">⭐ ⭐ ⭐</option>
                      <option value="">⭐ ⭐</option>
                      <option value="">⭐</option>
                </select>
      
            <!--Suggestion-->
            <h3>Any Suggestions ?</h3>
            <textarea placeholder="Write Your Suggestion Here.."></textarea>


            <!--Submit-->
            <button type="submit" class="submitbtn">Submit Form</button>


        </form>
    </section>

    <!--Footer-->
    <footer>
        <P>My Library</P>
    </footer>
</body>
</html>
