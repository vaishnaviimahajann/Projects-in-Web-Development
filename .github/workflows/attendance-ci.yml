name: Attendance System CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'simpleprojects/attendance-system/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./simpleprojects/attendance-system/backend
    env:
      MONGO_URL: ${{ secrets.MONGO_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./simpleprojects/attendance-system/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
  

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build backend Docker image
        run: docker build -t attendance-backend:${{ steps.set-tag.outputs.tag }} ./simpleprojects/attendance-system/backend

      - name: Build frontend Docker image
        run: docker build -t attendance-frontend:${{ steps.set-tag.outputs.tag }} ./simpleprojects/attendance-system/frontend